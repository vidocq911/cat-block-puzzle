<!doctype html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#23122f"><title>Cat Haven</title><style>html,body{margin:0;width:100%;height:100%;background:#180d27;overflow:hidden}#game{width:100%;height:100%}#status{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:#180d27;color:#ffe5c5;font:600 18px Arial,sans-serif;text-align:center;padding:22px;box-sizing:border-box}#status small{font-size:13px;max-width:340px;overflow-wrap:anywhere;color:#ffd6b4}</style></head><body><div id="game"></div><div id="status"><strong>Cat Haven yükleniyor...</strong><small id="detail">Oyun başlatılıyor</small></div><script>window.__catReady=function(){document.getElementById('status').remove()};function fail(e){var el=document.getElementById('status');if(!el)return;el.querySelector('strong').textContent='Oyun başlatılamadı';document.getElementById('detail').textContent=String(e).slice(0,600)}window.addEventListener('error',function(e){fail(e.message||'Bilinmeyen hata')});window.addEventListener('unhandledrejection',function(e){fail(e.reason&&e.reason.message||e.reason||'Yükleme hatası')});setTimeout(function(){if(document.getElementById('status'))fail('Yükleme 15 saniyeyi geçti. Sayfayı yenileyin veya bu hata metnini paylaşın.')},15000)</script><script type="module" src="/src/main.ts"></script></body></html>
