<!doctype html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#23122f"><title>Cat Haven</title><style>html,body{margin:0;width:100%;height:100%;background:#180d27;overflow:hidden}#game{width:100%;height:100%}#status{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:#180d27;color:#ffe5c5;font:600 18px Arial,sans-serif;text-align:center;padding:22px;box-sizing:border-box}#status small{font-size:13px;max-width:340px;overflow-wrap:anywhere;color:#ffd6b4}</style></head><body><div id="game"></div><div id="status"><strong>Cat Haven yükleniyor...</strong><small id="detail">Oyun başlatılıyor</small></div><script>window.__catReady=function(){document.getElementById('status').remove()};function fail(e){var el=document.getElementById('status');if(!el)return;el.querySelector('strong').textContent='Oyun başlatılamadı';document.getElementById('detail').textContent=String(e).slice(0,600)}window.addEventListener('error',function(e){fail(e.message||'Bilinmeyen hata')});window.addEventListener('unhandledrejection',function(e){fail(e.reason&&e.reason.message||e.reason||'Yükleme hatası')});setTimeout(function(){if(document.getElementById('status'))fail('Yükleme 15 saniyeyi geçti. Sayfayı yenileyin veya bu hata metnini paylaşın.')},15000)</script><script type="module" src="/src/main.ts"></script><script>
(function(){
let active=false,score=0,coins=500,selected=0,board=Array(64).fill(0);
const shapes=[[0],[0,1],[0,1,2],[0,1,8,9],[0,1,2,9],[0,8,16],[0,1,8]];
function start(){
if(active||!document.getElementById('status'))return;
active=true;document.getElementById('status').remove();
const root=document.getElementById('game');root.innerHTML='';
root.style.cssText='height:100dvh;width:100%;display:flex;justify-content:center;background:#180d27;overflow:hidden';
const app=document.createElement('div');app.style.cssText='position:relative;width:min(100vw,46.2dvh);height:100dvh;max-width:440px;overflow:hidden;background:#2c1736;color:white;font:700 17px Arial,sans-serif';root.appendChild(app);
function btn(label,top,left,width,fn){let b=document.createElement('button');b.textContent=label;b.style.cssText='position:absolute;top:'+top+'%;left:'+left+'%;width:'+width+'%;height:6.5%;border:2px solid #ffdfad;border-radius:16px;background:#a65b86;color:white;font:bold 15px Arial;box-shadow:0 3px 9px #271020aa;z-index:3';b.onclick=fn;app.appendChild(b)}
function scene(name){
app.innerHTML='';let img=document.createElement('img');img.src='assets/'+name+'.webp';img.style.cssText='width:100%;height:100%;object-fit:fill;position:absolute;inset:0';img.onerror=()=>{if(!img.dataset.tried){img.dataset.tried='1';img.src='public/assets/'+name+'.webp'}else{img.style.display='none';app.style.background='linear-gradient(#674568,#d18c94)'}};app.appendChild(img);
if(name==='home'){btn('OYNA',74,18,64,()=>scene('puzzle'));btn('DÜNYA',84,5,28,()=>scene('world'));btn('KEDİLER',84,36,28,()=>scene('cats'));btn('ODA',84,67,28,()=>scene('room'))}
else if(name==='puzzle'){
let bar=document.createElement('div');bar.style.cssText='position:absolute;top:4%;left:10%;width:80%;text-align:center;background:#3c254acb;padding:10px;border-radius:15px;z-index:2';bar.textContent='PUAN: '+score+'  ALTIN: '+coins;app.appendChild(bar);
let grid=document.createElement('div');grid.style.cssText='position:absolute;left:9%;top:24%;width:82%;aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:5px;background:#4c3159;border:4px solid #e8b873;border-radius:12px;box-sizing:border-box;z-index:2';app.appendChild(grid);
function redraw(){grid.innerHTML='';board.forEach((v,i)=>{let cell=document.createElement('div');cell.style.cssText='background:'+(v?'#f5b858':'#6d5379')+';border-radius:4px;box-shadow:inset 0 1px 3px #251029';cell.onclick=()=>place(i);grid.appendChild(cell)});bar.textContent='PUAN: '+score+'  ALTIN: '+coins}
function place(i){let shape=shapes[selected];let x=i%8,y=Math.floor(i/8);let positions=shape.map(k=>[x+k%8,y+Math.floor(k/8)]);if(positions.some(([a,b])=>a>7||b>7||board[b*8+a]))return;positions.forEach(([a,b])=>board[b*8+a]=1);score+=shape.length*10;coins+=shape.length;for(let row=0;row<8;row++)if(board.slice(row*8,row*8+8).every(Boolean))board.fill(0,row*8,row*8+8);for(let col=0;col<8;col++)if(Array.from({length:8},(_,r)=>board[r*8+col]).every(Boolean))for(let r=0;r<8;r++)board[r*8+col]=0;selected=Math.floor(Math.random()*shapes.length);redraw()}redraw();
btn('PARÇA: '+(selected+1),68,5,43,()=>{selected=(selected+1)%shapes.length;document.querySelectorAll('button')[0].textContent='PARÇA: '+(selected+1)});btn('YENİ OYUN',68,52,43,()=>{board.fill(0);score=0;redraw()});
btn('ODA',79,2,22,()=>scene('room'));btn('BAHÇE',79,27,22,()=>scene('garden'));btn('KEDİLER',79,52,22,()=>scene('cats'));btn('GÖREV',79,77,21,()=>scene('tasks'));btn('ANA SAYFA',89,24,52,()=>scene('home'));
}else{btn('GERİ',3,4,25,()=>scene('home'));btn('OYNA',88,29,42,()=>scene('puzzle'))}
}
scene('home');
}
setTimeout(start,3500);
window.addEventListener('error',()=>setTimeout(start,500));
})();
</script></body></html>
