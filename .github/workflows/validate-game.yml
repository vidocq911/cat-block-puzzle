name: Validate game JavaScript
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inline game script syntax
        run: |
          python3 - <<'PY'
          import re
          html = open("index.html", encoding="utf-8").read()
          scripts = re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>', html, re.S)
          inline = [s for s in scripts if s.strip()]
          if not inline:
              raise SystemExit("No inline game script found")
          open("/tmp/game.js", "w", encoding="utf-8").write(inline[-1])
          PY
          node --check /tmp/game.js
