name: Game UI smoke tests
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/cat-block-server.log 2>&1 &
      - run: node tests/ui-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cat-block-mobile-screenshots
          path: artifacts/*.png
          if-no-files-found: warn
