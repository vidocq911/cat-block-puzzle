name: Cat Haven smoke tests
on:
  push:
    branches: [gpt6-from-scratch]
  pull_request:
    paths:
      - 'index.html'
      - 'tests/ui-smoke.mjs'
      - '.github/workflows/cat-haven-smoke.yml'
permissions:
  contents: read
jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve game
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/cat-haven-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Run browser smoke test
        run: node tests/ui-smoke.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cat-haven-screenshots
          path: artifacts/
          if-no-files-found: ignore
